name: Quality gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, architecture, tests, and coverage (${{ matrix.git }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        git: [runner, minimum]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Ensure Git build headers are available
        if: matrix.git == 'minimum'
        shell: bash
        run: |
          if [[ "$(dpkg-query --show --showformat='${db:Status-Status}' zlib1g-dev 2>/dev/null)" != installed ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends zlib1g-dev
          fi
      - name: Build Git 2.43.7 for local repository tests
        if: matrix.git == 'minimum'
        shell: bash
        run: |
          set -euo pipefail
          version=2.43.7
          build=$(mktemp -d "$RUNNER_TEMP/gitten-git.XXXXXX")
          archive="git-$version.tar.xz"
          curl -q -fsS --proto '=https' -o "$build/$archive" \
            "https://www.kernel.org/pub/software/scm/git/$archive"
          (
            cd "$build"
            printf '%s  %s\n' '657e2374455d9e62f6cdb3e7c55d867b6db5404d744e97e112cc5b0db687a19f' "$archive" | sha256sum -c -
            tar -xf "$archive"
          )
          prefix="$build/install"
          make -s -j 4 -C "$build/git-$version" prefix="$prefix" \
            NO_CURL=YesPlease NO_EXPAT=YesPlease NO_GETTEXT=YesPlease NO_OPENSSL=YesPlease \
            NO_PERL=YesPlease NO_PYTHON=YesPlease NO_TCLTK=YesPlease install
          test "$("$prefix/bin/git" --version)" = "git version $version"
          printf '%s\n' "$prefix/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - if: matrix.git == 'runner'
        run: bun audit
      - name: Run quality gate
        env:
          GIT_VARIANT: ${{ matrix.git }}
        run: |
          if [[ "$GIT_VARIANT" == minimum ]]; then
            test "$(git --version)" = 'git version 2.43.7'
          fi
          git --version
          bun run quality:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gitten-quality-${{ matrix.git }}-${{ github.run_attempt }}
          path: |
            coverage/quality.json
            coverage/tests.xml
          if-no-files-found: ignore
