name: Update Homebrew Formula

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-formula:
    name: Update Formula
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute SHA256 checksums
        id: sha
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          # SHA256 of an empty input — the value produced when curl fails but the
          # pipe still succeeds. Guard against committing it as a real checksum.
          EMPTY_SHA="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

          sha_of_asset() {
            local asset="$1"
            local url="https://github.com/jmpanozzoz/gitten/releases/download/${TAG}/${asset}"
            local out="${asset}"
            # Absorb the race between "release published" and asset upload: the
            # release event can fire before binaries finish uploading, so retry
            # 404s for up to ~5 minutes instead of failing the run (and needing
            # a manual re-run, as happened on v1.1.2).
            curl -fSL --retry 20 --retry-delay 10 --retry-max-time 300 --retry-all-errors -o "$out" "$url"
            if [ ! -s "$out" ]; then
              echo "::error::Downloaded asset ${asset} is missing or empty" >&2
              exit 1
            fi
            local sum
            sum=$(sha256sum "$out" | cut -d' ' -f1)
            if [ -z "$sum" ] || [ "$sum" = "$EMPTY_SHA" ]; then
              echo "::error::Computed empty/placeholder SHA256 for ${asset}" >&2
              exit 1
            fi
            echo "$sum"
          }

          ARM64_SHA=$(sha_of_asset "gitten-darwin-arm64")
          X64_SHA=$(sha_of_asset "gitten-darwin-x64")

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arm64_sha=$ARM64_SHA" >> "$GITHUB_OUTPUT"
          echo "x64_sha=$X64_SHA" >> "$GITHUB_OUTPUT"

      - name: Update formula file
        env:
          VERSION: ${{ steps.sha.outputs.version }}
          ARM64_SHA: ${{ steps.sha.outputs.arm64_sha }}
          X64_SHA: ${{ steps.sha.outputs.x64_sha }}
        run: |
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/gitten.rb
          sed -i "/gitten-darwin-arm64/{n;s/sha256 \".*\"/sha256 \"${ARM64_SHA}\"/}" Formula/gitten.rb
          sed -i "/gitten-darwin-x64/{n;s/sha256 \".*\"/sha256 \"${X64_SHA}\"/}" Formula/gitten.rb

      - name: Open PR with updated formula
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/homebrew-formula-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Formula/gitten.rb
          git diff --cached --quiet && exit 0
          git commit -m "chore: update Homebrew formula to ${TAG}"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: update Homebrew formula to ${TAG}" \
            --body "Automated formula update after release ${TAG}. SHA256 checksums recomputed from published assets." \
            --base main \
            --head "$BRANCH"
