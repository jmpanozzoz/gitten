name: CI

on:
  push:
    branches-ignore:
      - main
      - 'release-rehearsal/**'
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  native:
    uses: ./.github/workflows/native.yml

  required:
    name: Test
    needs: [quality, native]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require both verification jobs
        env:
          QUALITY: ${{ needs.quality.result }}
          NATIVE: ${{ needs.native.result }}
        run: |
          printf 'Quality: %s\nNative: %s\n' "$QUALITY" "$NATIVE"
          test "$QUALITY" = success && test "$NATIVE" = success
